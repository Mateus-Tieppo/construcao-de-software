spring:
  application:
    name: ticket-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tkt}
    username: ${DB_USER:tkt_app}
    password: ${DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
        max.poll.records: 50
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/realms/pulsepass/protocol/openid-connect/certs}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

pulsepass:
  outbox:
    lock-id: 1003
  inventario:
    url: ${INVENTARIO_URL:http://localhost:8081}
  pdf:
    diretorio: ${PDF_DIR:/tmp/pulsepass-ingressos}
  qr:
    chave-privada: ${QR_CHAVE_PRIVADA:}
    chave-publica: ${QR_CHAVE_PUBLICA:}
